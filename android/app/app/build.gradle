plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nin0dev.vendroid'
    compileSdk 34

    defaultConfig {
        // VoidCord: own app id, installs next to VendroidEnhanced
        applicationId "lol.voidapp.voidcord"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "1.11.1-voidcord.1"
    }

    // VoidCord: release key lives outside the repo (~/.voidcord) – every update must be signed with the same key
    def keystoreFile = new File(System.getProperty("user.home"), ".voidcord/keystore.properties")
    if (keystoreFile.exists()) {
        def keystore = new Properties()
        keystoreFile.withInputStream { keystore.load(it) }
        signingConfigs {
            release {
                storeFile file(keystore.storeFile)
                storePassword keystore.storePassword
                keyAlias keystore.keyAlias
                keyPassword keystore.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }

        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // VoidCord: Android Studio's JDK is newer than 21 – Kotlin would target it and fail against Java's 21
    kotlinOptions {
        jvmTarget = "21"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}

